<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artzzium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/x-icon" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <style>
        :root {
            --bg-color: #020202;
            --card-glass: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --gold-color: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #101520 0%, #050505 100%);
        }

        header {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 40px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            display: flex;
            gap: 40px;
            z-index: 100;
            transition: all 0.4s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        header:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 500;
            color: #aaa;
            position: relative;
            padding: 8px 0;
            transition: all 0.3s ease;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .nav-item::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: #fff;
            transform: translateX(-50%) scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px #fff;
            opacity: 0;
        }

        .nav-item:hover::before,
        .nav-item.active::before {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 90px 20px 140px 20px;
            width: 100%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            perspective: 1000px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            min-height: 280px;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card.card-enter {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .card-img {
            width: 80px;
            height: 80px;
            background: transparent;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: transform 0.4s ease;
            z-index: 2;
            flex-shrink: 0;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
        }

        .card:hover .card-img {
            transform: scale(1.1) rotate(-3deg);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 600;
            z-index: 2;
            color: #fff;
            text-align: center;
        }

        .card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
            z-index: 2;
        }

        .card.expanded {
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(40px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.05), 0 20px 50px rgba(0, 0, 0, 0.8);
            cursor: default;
            transform: translateY(0) scale(1) !important;
        }

        .card-content {
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: absolute;
        }

        .card.expanded .card-content {
            opacity: 0;
            transform: scale(0.9) translateY(-50px);
            pointer-events: none;
        }

        .sub-options {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
            transition: all 0.5s ease 0.2s;
            align-items: center;
            justify-content: center;
        }

        .card.expanded .sub-options {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .sub-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            color: #ddd;
            transition: all 0.3s ease;
            height: 100%;
            max-height: 220px;
        }

        .sub-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .sub-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
            background: rgba(0, 0, 0, 0.2);
        }

        .sub-btn.disabled:hover {
            transform: none;
            box-shadow: none;
            background: rgba(0, 0, 0, 0.2);
        }

        .sub-icon {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .sub-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .sub-desc {
            font-size: 0.7rem;
            color: #aaa;
            line-height: 1.3;
        }

        .axolotl-container {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            perspective: 450px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .axolotl-header {
            z-index: 10;
            padding: 20px;
            width: 100%;
            text-align: center;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1);
            margin-bottom: 20px;
            position: absolute;
            top: 0;
        }

        .crawl-content {
            position: absolute;
            top: 100%;
            width: 80%;
            text-align: center;
            color: var(--gold-color);
            font-weight: 700;
            font-size: 6.5rem;
            letter-spacing: 2px;
            line-height: 2.5;
            animation: crawl 20s linear infinite;
            transform-origin: 50% 100%;
        }

        .crawl-content div {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        @keyframes crawl {
            0% {
                top: 100%;
                transform: rotateX(25deg) scale(0.9);
                opacity: 0;
            }

            2% {
                opacity: 1;
            }

            98% {
                opacity: 1;
            }

            100% {
                top: -300%;
                transform: rotateX(25deg) scale(0.001);
                opacity: 0;
            }
        }

        .capsule-footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 950px;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            z-index: 1000;
            transition: all 0.3s ease;
            gap: 40px;
        }

        .capsule-footer:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 1);
        }

        .footer-info-left,
        .footer-info-right {
            flex: 1;
        }

        .footer-title {
            font-size: 0.75rem;
            color: #fff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0.9;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-title::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d2ff;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.5;
            max-width: 90%;
        }

        .footer-warning {
            font-size: 0.8rem;
            color: #ffab40;
            margin-top: 5px;
            font-weight: 500;
        }

        .footer-info-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding-left: 40px;
        }

        .contact-row {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
        }

        .contact-row a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-row a:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .footer-logo-area {
            margin-left: 20px;
            padding-left: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }

        .creator-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: all 0.3s;
            text-decoration: none;
        }

        .creator-link:hover {
            transform: scale(1.1);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .designer-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            z-index: 2000;
            opacity: 0.7;
            filter: grayscale(100%);
            transition: all 0.4s ease;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .designer-badge img {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }

        .designer-badge:hover {
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.1) rotate(10deg);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
                gap: 10px;
                top: 15px;
                width: 95%;
                justify-content: space-evenly;
                background: rgba(10, 10, 15, 0.8);
                border-radius: 30px;
            }

            .nav-item {
                font-size: 0.85rem;
            }

            main {
                padding: 90px 15px 120px 15px;
                display: block;
                height: auto;
            }


            .grid-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }


            .agalar-grid {
                grid-template-columns: repeat(1, 1fr) !important;
                gap: 8px !important;
            }

            .agalar-grid .card {
                padding: 10px;
                min-height: 160px;
            }

            .agalar-grid .card h3 {
                font-size: 0.75rem;
            }

            .agalar-grid .card-img {
                width: 40px;
                height: 40px;
            }

            .card {
                min-height: 200px;
                padding: 15px;
            }

            .card-img {
                width: 50px;
                height: 50px;
                margin-bottom: 10px;
                border-radius: 10px;
            }

            .card h3 {
                font-size: 0.9rem;
            }

            .card p {
                font-size: 0.7rem;
            }

            .sub-btn {
                padding: 8px;
            }

            .sub-icon {
                width: 30px;
                height: 30px;
            }

            .sub-label {
                font-size: 0.8rem;
            }

            .sub-desc {
                font-size: 0.6rem;
            }

            .axolotl-container {
                height: 70vh;
            }

            .crawl-content {
                font-size: 5rem;
                width: 90%;
            }

            .capsule-footer {
                padding: 15px 20px;
                bottom: 15px;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                width: 95%;
            }

            .footer-info-left {
                display: none;
            }

            .footer-info-right {
                align-items: flex-start;
                text-align: left;
                padding-left: 0;
                width: auto;
            }

            .footer-title {
                font-size: 0.65rem;
                margin-bottom: 4px;
            }

            .contact-row {
                font-size: 0.75rem;
            }

            .footer-logo-area {
                position: absolute;
                right: 20px;
                border: none;
                margin: 0;
                padding: 0;
            }

            .creator-link {
                width: 35px;
                height: 35px;
            }

            .creator-link i {
                font-size: 1rem;
            }

            .designer-badge {
                bottom: 25px;
                right: 20px;
                width: 35px;
                height: 35px;
            }

            .thenks {
                font-size: 2.5rem !important;
            }

            @keyframes crawl {
                0% {
                    top: 100%;
                    transform: rotateX(25deg) scale(0.9);
                    opacity: 0;
                }

                2% {
                    opacity: 1;
                }

                98% {
                    opacity: 1;
                }

                100% {
                    top: -800%;
                    transform: rotateX(25deg) scale(0.001);
                    opacity: 0;
                }
            }
        }

        @media (max-width: 768px) {

            body {
                height: auto;

                overflow-y: auto;

                overflow-x: hidden;

            }

            main {
                padding: 90px 15px 120px 15px;
                display: block;
                height: auto;

                overflow: visible;
            }
        }
    </style>
</head>

    <script>

        const initThreeJS = () => {
            const container = document.getElementById('webgl-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 1;
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 6000;
            const posArray = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 5; }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0xffffff, transparent: true, opacity: 0.8 });
            const starMesh = new THREE.Points(starGeometry, starMaterial);
            scene.add(starMesh);
            let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;
            document.addEventListener('mousemove', (event) => { mouseX = (event.clientX - windowHalfX); mouseY = (event.clientY - windowHalfY); });
            const animate = () => {
                targetX = mouseX * 0.001; targetY = mouseY * 0.001;
                starMesh.rotation.y += 0.5 * (targetX - starMesh.rotation.y);
                starMesh.rotation.x += 0.05 * (targetY - starMesh.rotation.x);
                starMesh.rotation.z += 0.0005;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            };
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
        initThreeJS();

                    desc: "Video paketi ve Remake paketi."
                },
                { title: "Kenshi", image: "kenshi.png", type: "link", url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3627616608", desc: "Videodaki paketi tıkla indir!" },
                { title: "Skyrim", image: "skyrim.png", type: "link", url: "https://nolvus.net", desc: "Videodaki paketin indirme linki." },
                { title: "Minecraft", image: "minecraft.png", type: "link", url: "https://legacy.curseforge.com/minecraft/modpacks/artzzium-premium", desc: "Yayındaki paketi tıkla indir!" }
            ],
            agalar: [
                { title: "AhmetPe", image: "ahmetpe.png", type: "link", url: "https://kick.com/ahmetpe", desc: "Kick'te muhabbet etmek için alternatif." },
                { title: "SadeSoda", image: "soda.png", type: "link", url: "https://www.youtube.com/@SadeSodabey", desc: "Keyifli Youtube içerikleri için alternatif." },
                { title: "DaliaGrace", image: "dalia.png", type: "link", url: "https://kick.com/daliagrace", desc: "Kick'te muhabbet etmek için alternatif." }
            ],
            axolotlar: [
                "WhiteChapter", "mrAlhn", "Meaningles", "ekremcicek1", "daliagrace"
            ]
        };

        const gridContainer = document.getElementById('content-grid');
        const navItems = document.querySelectorAll('.nav-item');
        loadContent('social');

        navItems.forEach(item => {
            const handleNav = () => {
                if (item.classList.contains('active')) return;
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                loadContent(item.getAttribute('data-target'));
            };
            item.addEventListener('mouseenter', handleNav);
            item.addEventListener('click', handleNav);
        });

        function loadContent(category) {
            gridContainer.innerHTML = '';

            if (category === 'agalar') {
                gridContainer.classList.add('agalar-grid');
            } else {
                gridContainer.classList.remove('agalar-grid');
            }

            if (category === 'axolotlar') {
                gridContainer.style.display = 'flex';
                gridContainer.style.justifyContent = 'center';

                const namesHtml = data.axolotlar.map(name => `<div>${name}</div>`).join('');

                gridContainer.innerHTML = `
                    <div class="axolotl-container">
                        <div class="axolotl-header">12 ayı geçmiş rozetli kick aboneleri</div>
                        <div class="crawl-content">
                            ${namesHtml}
                            <div class="thenks" style="margin-top:50px; font-size:3.5rem; opacity:0.7;">Teşekkürler...</div>
                        </div>
                    </div>
                `;
            }

            else {
                gridContainer.style.display = 'grid';
                let items = data[category] || [];

                items.forEach((item, index) => {
                    const card = document.createElement('div'); card.className = 'card';

                    card.innerHTML = `
                        <div class="card-content">
                            <div class="card-img">
                                <img src="${item.image}" alt="${item.title}">
                            </div>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>`;

                    if (item.type === 'link') {
                        card.addEventListener('click', () => window.open(item.url, '_blank'));
                    }
                    else if (item.type === 'split') {
                        const img1 = item.option1.image ? `<img src="${item.option1.image}" class="sub-icon">` : '';
                        const desc1 = item.option1.desc ? `<div class="sub-desc">${item.option1.desc}</div>` : '';
                        const isMaint1 = item.option1.url === '#maintenance';
                        const click1 = isMaint1 ? '' : `window.open('${item.option1.url}', '_blank')`;
                        const class1 = isMaint1 ? 'sub-btn disabled' : 'sub-btn';

                        const img2 = item.option2.image ? `<img src="${item.option2.image}" class="sub-icon">` : '';
                        const desc2 = item.option2.desc ? `<div class="sub-desc">${item.option2.desc}</div>` : '';

                        card.innerHTML += `
                            <div class="sub-options">
                                <div class="${class1}" onclick="event.stopPropagation(); ${click1}">
                                    ${img1}
                                    <div class="sub-label">${item.option1.label}</div>
                                    ${desc1}
                                </div>
                                <div class="sub-btn" onclick="event.stopPropagation(); window.open('${item.option2.url}', '_blank')">
                                    ${img2}
                                    <div class="sub-label">${item.option2.label}</div>
                                    ${desc2}
                                </div>
                            </div>`;

                        card.addEventListener('click', function () { this.classList.add('expanded'); });
                        card.addEventListener('mouseleave', function () { this.classList.remove('expanded'); });
                    }

                    gridContainer.appendChild(card);
                    setTimeout(() => card.classList.add('card-enter'), index * 100 + 50);
                });
            }
        }
    </script>
</body>

</html>
